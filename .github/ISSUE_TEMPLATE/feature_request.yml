name: Feature request
description: Something q4 should compute, check, or read.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to compute or verify, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How you imagine q4 handling it.
    validations:
      required: true
  - type: dropdown
    id: cell
    attributes:
      label: Which codes
      multiple: true
      options:
        - GF(4)-linear
        - Qubit stabilizer (additive GF(4))
        - Z4-linear
        - Ququart stabilizer (Z4 symplectic)
        - Something else
  - type: textarea
    id: elsewhere
    attributes:
      label: How other tools handle it
      description: Magma, Sage, GUAVA, QDistRnd, or anything else that does this well or badly.
